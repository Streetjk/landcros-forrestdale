services:
  # Landcros Forrestdale — Node.js web service (server.js handles SITE routing)
  - type: web
    name: landcros-forrestdale
    runtime: node
    buildCommand: npm ci
    startCommand: node server.js
    envVars:
      - key: SITE
        value: landcros
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: credentialless

  # Brown Greenfields — static site built via build.sh
  - type: web
    name: Brown-greenfields
    runtime: static
    buildCommand: bash build.sh greenfields
    staticPublishPath: dist-greenfields
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: credentialless
