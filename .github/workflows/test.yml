name: SiteNav tests
on:
  pull_request:
  push:
    branches: [main, 'review/**']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Check browser module syntax
        run: |
          for f in viewer3d.js guide-url.js location-details.js public-data.js; do
            node --input-type=module --check < "$f"
          done

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sitenav_test
          POSTGRES_PASSWORD: sitenav_test_ci_only
          POSTGRES_DB: sitenav_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sitenav_test -d sitenav_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run PostgreSQL ownership and capability integration
        env:
          SITENAV_TEST_DATABASE_URL: postgresql://sitenav_test:sitenav_test_ci_only@127.0.0.1:5432/sitenav_test
        run: node --test tests/point-ownership.integration.test.mjs
